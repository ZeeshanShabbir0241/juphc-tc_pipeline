apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: cd-pipeline-run
spec:
  pipelineRef:
    name: cd-pipeline
  workspaces:
    - name: pipeline-workspace
      persistentVolumeClaim:
        claimName: pipelined-pvc
  params:
    - name: repo-url
      value: "https://github.com/YOUR_GITHUB_USERNAME/tax_calculator.git"
    - name: branch
      value: "main"